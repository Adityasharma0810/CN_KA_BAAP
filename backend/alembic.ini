[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by EB_DATABASE_URL at runtime)
sqlalchemy.url = sqlite+aiosqlite:///./data/experience_budget.sqlite3

# timezone to use when rendering the date
# within the migration files as well as the file name.
# value is required by newer versions of alembic. Use 'utc' for consistency.
timezone = utc

# The version location
version_locations = alembic/versions

# The encoding used to write files
file_encoding = utf-8

# The version table name
version_table = alembic_version

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts.
post_write_hooks = black

[post_write_hooks.black]
implementation = alembic.autogenhooks.black
callable = reformat

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
